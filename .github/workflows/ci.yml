name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1

  test:
    name: Unit Tests (${{ matrix.platform }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            destination: platform=macOS
          - platform: iOS
            destination: platform=iOS Simulator,OS=latest,name=iPhone 17 Pro
          - platform: tvOS
            destination: platform=tvOS Simulator,OS=latest,name=Apple TV
          - platform: visionOS
            destination: platform=visionOS Simulator,OS=latest,name=Apple Vision Pro
          - platform: watchOS
            destination: platform=watchOS Simulator,OS=latest,name=Apple Watch Series 11 (42mm)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ^26.0

      - name: Build and Test
        uses: sersoft-gmbh/xcodebuild-action@v4
        with:
          spm-package: ./
          scheme: JWW Swift Toolkit-Package
          destination: ${{ matrix.destination }}
          action: test
